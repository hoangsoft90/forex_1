name: Build Android Debug APK

on:
  workflow_dispatch:            # nút "Run workflow" thủ công trong tab Actions
  push:
    branches: [main]            # tự build mỗi lần push lên main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Public-by-design: các giá trị này đi kèm trong APK (ai tải về đều đọc được),
      # lớp bảo vệ thật là Supabase RLS. Không đưa service_role_key vào đây bao giờ.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ycmuuczwnogybyklzpsa.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbXV1Y3p3bm9neWJ5a2x6cHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Mjg5ODQsImV4cCI6MjEwMjUwNDk4NH0.wojHxvi-3-0yyR_NlpMU3XsEmcLDjs1MB62Nv90Tcgg' }}
      EXPO_PUBLIC_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      EXPO_PUBLIC_ADMOB_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/5224354917
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java (JDK 17 — required for Expo SDK 52+ / RN 0.7x+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (accepts licenses + build-tools)
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate native project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      # Debug APK — signed tự động bằng debug keystore mặc định của Gradle,
      # KHÔNG cần keystore riêng, cài được lên máy để test (không submit store).
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-discipline-os-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
